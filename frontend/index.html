<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Factory Product Code Validator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ── ITC Limited brand system ───────────────────────────────────────────
      // The ITC corporate mark is a deep navy triangle. The whole product is
      // anchored to that navy (not the generic SaaS blue). The Tailwind `blue`
      // ramp is intentionally REMAPPED to this navy scale so every existing
      // `blue-600/700/...` class renders on-brand without per-file churn.
      const itcNavy = {
        50:  '#EEF2F8',
        100: '#D7E0EE',
        200: '#B0C2DC',
        300: '#7F9BC4',
        400: '#4C6CA3',
        500: '#2C4B82',
        600: '#1B3361',  // primary — close to the logo navy
        700: '#15294E',  // primary hover / pressed
        800: '#112141',
        900: '#0C1830',
        950: '#070F1F',
      };
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            colors: {
              // Semantic brand tokens (preferred for new code).
              brand: { ...itcNavy, DEFAULT: itcNavy[600] },
              // Remap blue → ITC navy so legacy `blue-*` classes are on-brand.
              blue: itcNavy,
              // A single, restrained accent for highlights/links (corporate cyan-navy).
              accent: { DEFAULT: '#0369A1', hover: '#075985', light: '#E8F1F8' },
            },
            boxShadow: {
              card: '0 1px 2px 0 rgba(12,24,48,0.06), 0 1px 3px 0 rgba(12,24,48,0.05)',
              'card-lg': '0 4px 16px -2px rgba(12,24,48,0.10), 0 2px 6px -2px rgba(12,24,48,0.06)',
              'card-hover': '0 6px 20px -4px rgba(12,24,48,0.14), 0 3px 8px -3px rgba(12,24,48,0.08)',
            },
          },
        },
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var choice = JSON.parse(localStorage.getItem('theme')) || 'system';
          var dark = choice === 'dark' ||
            (choice === 'system' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #F4F6FA;
        color: #0C1830;
        font-family: '"Plus Jakarta Sans"', 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Make the app fill the window edge to edge so the page background never
         shows as a lighter strip below short content. Percentage heights track the
         real layout viewport exactly (dvh/vh can under-resolve and leave a gap). */
      html { height: 100%; }
      body { min-height: 100%; margin: 0; }
      #root { min-height: 100%; }

      /* Bottom padding for the main content area. On mobile (< md / 768px) the fixed
         bottom nav (~64px) overlays content, so clear it plus the device safe-area so
         the last element (e.g. a submit button) is always reachable by scrolling.
         At md+ there is no bottom nav, so a normal 2rem is enough. */
      .main-content { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); }
      @media (min-width: 768px) { .main-content { padding-bottom: 2rem; } }
      /* Tabular figures for all data: prices, dates, barcodes, counters — prevents layout jitter */
      .font-mono, code, pre, table, .tabular-nums { font-variant-numeric: tabular-nums; }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.98) translateY(3px); }
        to   { opacity: 1; transform: scale(1)    translateY(0px); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pageIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in  { animation: fadeIn  0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-slide-up { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-page-in  { animation: pageIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Refined scrollbars for data-heavy panels */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #C7D1E0; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #A7B5CC; background-clip: content-box; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* Hide arrows from number input */
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }

      /* Brand-consistent focus ring (ITC navy) */
      :focus-visible { outline: 2px solid #1B3361; outline-offset: 2px; }
      button, [role="button"] { cursor: pointer; -webkit-tap-highlight-color: transparent; }

      /* Snappier taps on touch devices (removes the 300ms delay) and a subtle,
         consistent press feedback on primary buttons for a tactile, premium feel. */
      button, a, [role="button"], input, select, textarea { touch-action: manipulation; }
      .press { transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease; }
      .press:active { transform: scale(0.98); }

      /* ──────────────────────────────────────────────────────────────────────
         DARK THEME — "graphite navy". A premium black/gray blend (never pure
         black) with a faint navy lean that ties back to the ITC brand. Surfaces
         step up in elevation (bg → surface → elevated) so cards, the header, and
         modals read as distinct layers. The app uses hardcoded `white`/`slate-*`
         utilities everywhere, so rather than touch ~275 call sites we globally
         retarget those exact utilities (incl. opacity variants on the header/nav)
         to these tokens. Contrast tuned for WCAG AA in both modes.
         ────────────────────────────────────────────────────────────────────── */
      html.dark {
        --bg:        #14171C;  /* app background — deepest layer  */
        --surface:   #1E222A;  /* cards / panels                  */
        --surface-2: #262B34;  /* slate-50/100 fills, inputs      */
        --surface-3: #2F3540;  /* slate-200 fills, hover          */
        --elevated:  #21262F;  /* header / sticky bars (slightly lifted) */
        --border:    #2E343F;  /* default borders / dividers      */
        --border-2:  #3B424F;  /* stronger borders                */
        --text:      #F1F3F6;  /* primary text  (~15:1)           */
        --text-2:    #C7CDD8;  /* secondary text                  */
        --text-3:    #9BA4B3;  /* muted text                      */
        --text-4:    #717B8C;  /* faint text                      */
        /* Brighter, more saturated primary so buttons pop on dark. */
        --primary:        #3B6FD4;
        --primary-hover:  #4C7DE0;
        --on-primary:     #FFFFFF;
        --ring:           #5B8DEF;
        color-scheme: dark;
      }

      html.dark body { background-color: var(--bg); color: var(--text); }

      /* Surfaces (incl. translucent header/nav variants) */
      html.dark .bg-white        { background-color: var(--surface) !important; }
      html.dark [class*="bg-white/"] { background-color: color-mix(in srgb, var(--elevated) 92%, transparent) !important; }
      html.dark .bg-slate-50     { background-color: var(--surface-2) !important; }
      html.dark .bg-slate-100    { background-color: var(--surface-2) !important; }
      html.dark .bg-slate-200    { background-color: var(--surface-3) !important; }
      html.dark .bg-\[\#F4F6FA\] { background-color: var(--bg) !important; }
      /* The login branding panel and modal headers keep their navy gradient; the
         dark "Use Camera" / slate-900 buttons get a touch of lift so they don't
         vanish into the page. */
      html.dark .bg-slate-900    { background-color: #11151B !important; }
      html.dark .bg-slate-800    { background-color: #1A1F27 !important; }
      html.dark .hover\:bg-slate-800:hover { background-color: #232934 !important; }

      /* Text */
      html.dark .text-slate-900 { color: var(--text) !important; }
      html.dark .text-slate-800 { color: var(--text) !important; }
      html.dark .text-slate-700 { color: var(--text-2) !important; }
      html.dark .text-slate-600 { color: var(--text-2) !important; }
      html.dark .text-slate-500 { color: var(--text-3) !important; }
      html.dark .text-slate-400 { color: var(--text-3) !important; }   /* lift muted text for legibility */

      /* Borders / dividers (incl. translucent variants on header/cards) */
      html.dark .border-slate-50,
      html.dark .border-slate-100,
      html.dark .border-slate-200 { border-color: var(--border) !important; }
      html.dark .border-slate-300 { border-color: var(--border-2) !important; }
      html.dark [class*="border-slate-200/"],
      html.dark [class*="border-slate-100/"] { border-color: var(--border) !important; }
      html.dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: var(--border) !important; }

      /* Inputs: placeholders + hover fills */
      html.dark .placeholder-slate-400::placeholder { color: var(--text-4) !important; }
      html.dark .hover\:bg-slate-50:hover  { background-color: var(--surface-2) !important; }
      html.dark .hover\:bg-slate-100:hover { background-color: var(--surface-3) !important; }
      html.dark .hover\:bg-slate-200:hover { background-color: var(--border-2) !important; }

      /* Primary buttons — brighter, more saturated blue for a premium, visible CTA.
         The app's `blue-600` is the brand navy (too dark on charcoal), so on dark
         we lift it to a vivid blue and add a subtle depth shadow. */
      html.dark .bg-blue-600 { background-color: var(--primary) !important; color: var(--on-primary) !important; }
      html.dark .hover\:bg-blue-700:hover,
      html.dark .bg-blue-700 { background-color: var(--primary-hover) !important; }
      html.dark .bg-blue-600.shadow-sm,
      html.dark .bg-blue-600.shadow-card { box-shadow: 0 2px 8px -1px rgba(59,111,212,0.45), 0 1px 2px rgba(0,0,0,0.4) !important; }
      /* Avatar / soft-blue chips */
      html.dark .bg-blue-100 { background-color: rgba(91,141,239,0.22) !important; }
      html.dark .text-blue-700, html.dark .text-brand-700, html.dark .text-blue-600, html.dark .text-brand-600 { color: #9CC0FF !important; }

      /* Tinted status chips — keep the hue, drop the bright pastel fill, brighten
         text so it clears AA against charcoal. */
      html.dark .bg-blue-50,
      html.dark .bg-brand-50   { background-color: rgba(91,141,239,0.16) !important; }
      html.dark .bg-emerald-50,
      html.dark .bg-green-50   { background-color: rgba(16,185,129,0.15) !important; }
      html.dark .bg-emerald-100,
      html.dark .bg-green-100  { background-color: rgba(16,185,129,0.22) !important; }
      html.dark .bg-red-50     { background-color: rgba(239,68,68,0.15)  !important; }
      html.dark .bg-red-100    { background-color: rgba(239,68,68,0.22)  !important; }
      html.dark .bg-amber-50   { background-color: rgba(245,158,11,0.15) !important; }
      html.dark .text-emerald-700, html.dark .text-green-700, html.dark .text-green-800 { color: #4ADE9B !important; }
      html.dark .text-red-700,     html.dark .text-red-800   { color: #FF9090 !important; }
      html.dark .text-amber-700  { color: #F7C873 !important; }

      /* Logo chip: transparent in light, a soft light pill in dark so the navy
         ITC mark stays crisp and legible against the charcoal header. */
      .logo-chip { padding: 0; border-radius: 8px; background: transparent; transition: background-color 0.2s ease, padding 0.2s ease; }
      html.dark .logo-chip { background: #EEF2F8; padding: 3px 7px; box-shadow: 0 1px 2px rgba(0,0,0,0.35); }

      /* Focus ring — brighter on dark for visibility. */
      html.dark :focus-visible { outline-color: var(--ring); }

      /* Dark scrollbars */
      html.dark ::-webkit-scrollbar-thumb { background: #3B424F; }
      html.dark ::-webkit-scrollbar-thumb:hover { background: #4A5363; }

      /* Smooth the flip between themes (but not on initial load). */
      html.theme-ready body,
      html.theme-ready .bg-white,
      html.theme-ready [class*="bg-white/"],
      html.theme-ready .bg-slate-50,
      html.theme-ready .bg-slate-100,
      html.theme-ready .bg-blue-600 {
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-fade-in, .animate-slide-up, .animate-page-in { animation: none; }
        .press:active { transform: none; }
        * { scroll-behavior: auto !important; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
